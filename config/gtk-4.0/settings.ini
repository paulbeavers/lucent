# Fallbacks only. Under Wayland GTK takes the theme, icons and fonts from
# gsettings (org.gnome.desktop.interface), which theme.sh sets on every theme
# switch, and GTK_THEME from env.lua overrides the theme name on top. These
# keys matter only where gsettings has nothing to say, so they are not kept in
# step with the active theme.
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-enable-animations=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
# Greyscale, as fontconfig/conf.d/60-lucent-no-subpixel.conf makes it everywhere.
gtk-xft-rgba=none
