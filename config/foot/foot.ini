# foot is the fallback terminal: terminal.sh opens it where kitty cannot run,
# because foot draws on the CPU and needs no OpenGL. Kept close to kitty.conf
# so the two look alike. Not themed by theme.sh yet; these are foot's own
# dark colours.
font=JetBrainsMono Nerd Font:size=11.5
pad=10x10

[colors]
alpha=0.95

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no
