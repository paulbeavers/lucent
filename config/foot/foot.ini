# foot — terminal
# Full docs: man foot.ini
#
# foot draws on the CPU and needs no OpenGL, so it opens on any graphics stack:
# a broken driver, a VM without 3D, install media. Without a terminal there is
# no way left to fix anything from inside the session.

[main]
font=JetBrainsMono Nerd Font:size=11.5
pad=10x10
# 120 columns by 42 rows. Hyprland sizes tiled windows itself, so this is the
# size of a floating terminal: float-all mode, or a window floated by hand.
initial-window-size-chars=120x42

# Generated by hypr/scripts/theme.sh — SUPER+SHIFT+T switches the theme. foot
# reads it at start, so open terminals keep the old colours. Edits there are
# overwritten.
include=~/.config/foot/colors.ini

[cursor]
style=block
blink=no

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no
