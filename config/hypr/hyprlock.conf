################################################################################
#  hyprlock — lock screen
#
#  Test it without locking yourself out:  hyprlock --immediate
#  If a config error ever leaves you stuck, switch to a TTY with Ctrl+Alt+F2.
################################################################################

# Patched in place by hypr/scripts/theme.sh. hyprlock is deliberately not on
# an include: a broken config here locks you out, and there is no dry-run.
$base    = rgb(1e1e2e)
$text    = rgb(cdd6f4)
$mauve   = rgb(cba6f7)
$red     = rgb(f38ba8)
$surface = rgb(313244)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/Pictures/wallpapers/default.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.17
}

# ── clock ─────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $text
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# ── password field ────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 340, 55
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true

    outer_color = $mauve
    inner_color = $surface
    font_color  = $text
    check_color = $mauve
    fail_color  = $red

    fade_on_empty = false
    placeholder_text = <span foreground="##a6adc8">Enter password</span>
    fail_text = <span foreground="##f38ba8">Wrong ($ATTEMPTS)</span>

    rounding = 12
    position = 0, -60
    halign = center
    valign = center
}

# ── user ──────────────────────────────────────────────────────────────────────
label {
    monitor =
    text = $USER
    color = $text
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -140
    halign = center
    valign = center
}
