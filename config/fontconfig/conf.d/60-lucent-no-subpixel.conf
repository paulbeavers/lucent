<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Greyscale font smoothing on every distribution. Ubuntu enables subpixel (RGB)
  smoothing system-wide through /etc/fonts/conf.d/10-sub-pixel-rgb.conf, and Arch
  does not, so the same desktop on the same monitor had softer, colour-fringed text.
-->
<fontconfig>
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
  <match target="pattern">
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
